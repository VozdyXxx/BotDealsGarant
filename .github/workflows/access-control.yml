name: 🛡️ Repository Access Control

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  access-control:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔍 Check user authorization
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const actor = context.actor;
            
            // Authorized users (add more usernames here if needed)
            const authorizedUsers = ['VozdyXxx'];
            
            // Check if user is authorized
            const isAuthorized = authorizedUsers.includes(actor) || actor === owner;
            
            if (!isAuthorized) {
              const issueNumber = context.payload.issue?.number;
              const prNumber = context.payload.pull_request?.number;
              
              if (issueNumber) {
                // Handle unauthorized issue
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: `🚫 **Access Denied**
                  
                  This repository has restricted access for issues and modifications.
                  
                  **For support and inquiries, please use:**
                  - 💬 **Telegram**: [@Breathe_VozdyX](https://t.me/Breathe_VozdyX)
                  - 📧 **Email**: 12lamiya34@gmail.com
                  
                  Your request will be reviewed and handled directly by the developer.
                  
                  ---
                  *This is an automated security response.*`
                });
                
                // Close and lock the issue
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  state: 'closed'
                });
                
                await github.rest.issues.lock({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  lock_reason: 'spam'
                });
              }
              
              if (prNumber) {
                // Handle unauthorized PR
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: `🚫 **Pull Request Access Denied**
                  
                  This repository does not accept external pull requests.
                  
                  **To contribute or suggest changes:**
                  - Contact the developer via Telegram: [@Breathe_VozdyX](https://t.me/Breathe_VozdyX)
                  - Send your suggestions via email: 12lamiya34@gmail.com
                  
                  ---
                  *This is an automated security response.*`
                });
                
                // Close the PR
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: prNumber,
                  state: 'closed'
                });
              }
            }