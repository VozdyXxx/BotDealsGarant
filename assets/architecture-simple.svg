<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0d1117"/>
  
  <!-- Header -->
  <rect x="50" y="40" width="700" height="50" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="400" y="70" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#58a6ff">
    🛡️ BotDealsGarant Architecture
  </text>
  
  <!-- Top Layer -->
  <rect x="80" y="120" width="140" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="150" y="145" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#e6edf3">👥 Users</text>
  <text x="150" y="165" font-family="Arial" font-size="11" text-anchor="middle" fill="#8b949e">Multilang UI</text>
  
  <rect x="280" y="120" width="140" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="350" y="145" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#e6edf3">🤖 Bot Core</text>
  <text x="350" y="165" font-family="Arial" font-size="11" text-anchor="middle" fill="#8b949e">Aiogram FSM</text>
  
  <rect x="480" y="120" width="140" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="550" y="145" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#e6edf3">👨‍💼 Admin</text>
  <text x="550" y="165" font-family="Arial" font-size="11" text-anchor="middle" fill="#8b949e">Management</text>
  
  <!-- Arrows -->
  <line x1="220" y1="155" x2="280" y2="155" stroke="#6cb6ff" stroke-width="2"/>
  <polygon points="280,155 270,150 270,160" fill="#6cb6ff"/>
  
  <line x1="420" y1="155" x2="480" y2="155" stroke="#6cb6ff" stroke-width="2"/>
  <polygon points="480,155 470,150 470,160" fill="#6cb6ff"/>
  
  <!-- Handlers -->
  <rect x="200" y="240" width="400" height="60" rx="8" fill="#0d1117" stroke="#21262d"/>
  <text x="400" y="260" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#9ecbff">📱 Handlers</text>
  <text x="400" y="280" font-family="monospace" font-size="12" text-anchor="middle" fill="#e6edf3">Main | Deals | Pay | Menu | Logic | API</text>
  
  <!-- Arrow down -->
  <line x1="350" y1="190" x2="350" y2="240" stroke="#6cb6ff" stroke-width="2"/>
  <polygon points="350,240 345,230 355,230" fill="#6cb6ff"/>
  
  <!-- Bottom Layer -->
  <rect x="150" y="350" width="200" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="250" y="375" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#9ecbff">🗄️ SQLite DB</text>
  <text x="250" y="395" font-family="Arial" font-size="10" text-anchor="middle" fill="#e6edf3">• User Data</text>
  <text x="250" y="410" font-family="Arial" font-size="10" text-anchor="middle" fill="#e6edf3">• Transactions</text>
  
  <rect x="400" y="350" width="200" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="500" y="375" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#9ecbff">🌐 External APIs</text>
  <text x="500" y="395" font-family="Arial" font-size="10" text-anchor="middle" fill="#e6edf3">• CryptoBot</text>
  <text x="500" y="410" font-family="Arial" font-size="10" text-anchor="middle" fill="#e6edf3">• Telegram API</text>
  
  <!-- Arrows to bottom -->
  <line x1="300" y1="300" x2="250" y2="350" stroke="#48bb78" stroke-width="2"/>
  <polygon points="250,350 255,340 245,345" fill="#48bb78"/>
  
  <line x1="450" y1="300" x2="500" y2="350" stroke="#48bb78" stroke-width="2"/>
  <polygon points="500,350 495,340 505,345" fill="#48bb78"/>
  
  <!-- Tech Stack -->
  <rect x="100" y="450" width="600" height="30" rx="5" fill="#21262d"/>
  <text x="120" y="470" font-family="Arial" font-size="11" font-weight="bold" fill="#58a6ff">🚀 Tech Stack:</text>
  <text x="220" y="470" font-family="Arial" font-size="10" fill="#e6edf3">Python • Aiogram • SQLite • CryptoBot API • Telegram Stars</text>
</svg>